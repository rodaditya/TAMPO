<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root {
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;

    --accent: #5B6EF5;
    --accent-soft: #5B6EF51a;

    /* urgency signal colors */
    --sig-grey: #8A8F98;
    --sig-grey-bg: #8a8f9814;
    --sig-green: #22C58B;
    --sig-green-bg: #22c58b14;
    --sig-yellow: #E5A93C;
    --sig-yellow-bg: #e5a93c1c;
    --sig-red: #EF5A5A;
    --sig-red-bg: #ef5a5a1c;
  }

  html[data-theme="dark"] {
    --bg: #0F1115;
    --bg-grid: #ffffff08;
    --surface: #171A21;
    --surface-raised: #1E222B;
    --border: #2A2E38;
    --text-primary: #EDEEF2;
    --text-secondary: #8B909C;
    --text-tertiary: #5C616D;
    --shadow: 0 8px 24px -8px rgba(0,0,0,0.55);
    --overlay: rgba(8, 9, 12, 0.72);
  }

  html[data-theme="light"] {
    --bg: #F3F4F7;
    --bg-grid: #00000006;
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --border: #E3E5EB;
    --text-primary: #171A21;
    --text-secondary: #676C78;
    --text-tertiary: #9499A3;
    --shadow: 0 8px 24px -10px rgba(23,26,33,0.18);
    --overlay: rgba(23, 26, 33, 0.45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 100% 42px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0 / 42px 100%,
      var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s ease, color .25s ease;
  }

  /* ============ HEADER ============ */
  header.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 18px 32px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .brand .dot { color: var(--accent); }
  .brand .subtitle {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .topbar-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Assignee filter */
  .assignee-filter {
    position: relative;
  }
  .filter-trigger {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 14px;
    border-radius: var(--radius-md);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .15s ease;
  }
  .filter-trigger:hover { border-color: var(--accent); }
  .filter-trigger .stack {
    display: flex;
  }
  .filter-trigger .stack span {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-family: var(--font-mono);
    font-size: 9px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--surface);
    margin-left: -7px;
  }
  .filter-trigger .stack span:first-child { margin-left: 0; }
  .filter-trigger .chevron { color: var(--text-tertiary); font-size: 10px; }

  .filter-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 240px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 2px;
    z-index: 30;
  }
  .filter-panel.open { display: flex; }
  .filter-panel .panel-label {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    padding: 4px 8px 8px;
  }
  .filter-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  .filter-option:hover { background: var(--bg); }
  .filter-option input { accent-color: var(--accent); width: 15px; height: 15px; }
  .filter-option .avatar-sm {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .filter-option.disabled { opacity: 0.35; pointer-events: none; }
  .filter-hint {
    font-size: 11px;
    color: var(--text-tertiary);
    padding: 6px 8px 2px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }

  /* Theme toggle */
  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 15px;
  }
  .theme-toggle:hover { border-color: var(--accent); }

  /* ============ BOARD ============ */
  .board {
    display: flex;
    gap: 18px;
    padding: 24px 32px 100px;
    align-items: flex-start;
    overflow-x: auto;
  }

  .empty-state {
    margin: 60px auto;
    text-align: center;
    color: var(--text-tertiary);
    font-family: var(--font-mono);
    font-size: 13px;
  }

  .column {
    flex: 1 1 340px;
    min-width: 300px;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .column-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 16px 14px;
    border-bottom: 1px solid var(--border);
  }
  .column-head .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .column-head .who { flex: 1; min-width: 0; }
  .column-head .who .name {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .column-head .who .role {
    font-size: 11px;
    color: var(--text-tertiary);
  }
  .column-head .count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 20px;
  }

  .column-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px;
  }

  /* ============ TASK CARD ============ */
  .task-card {
    position: relative;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    border-left: 4px solid var(--sig-grey);
    background: var(--sig-grey-bg);
    padding: 14px 14px 12px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .task-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .task-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .task-card.status-not-picked { border-left-color: var(--sig-grey); background: var(--sig-grey-bg); }
  .task-card.status-on-track  { border-left-color: var(--sig-green); background: var(--sig-green-bg); }
  .task-card.status-at-risk   { border-left-color: var(--sig-yellow); background: var(--sig-yellow-bg); }
  .task-card.status-overdue   { border-left-color: var(--sig-red); background: var(--sig-red-bg); }

  .task-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .initials-badge {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .days-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 5px;
    letter-spacing: 0.02em;
    color: #fff;
    white-space: nowrap;
  }
  .status-not-picked .days-chip { background: var(--sig-grey); }
  .status-on-track  .days-chip { background: var(--sig-green); color: #08301f; }
  .status-at-risk   .days-chip { background: var(--sig-yellow); color: #3a2600; }
  .status-overdue   .days-chip { background: var(--sig-red); }

  .task-name {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text-primary);
    margin: 0 0 6px;
  }
  .task-meta {
    font-size: 11px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
  }

  /* ============ COMPLETED ACCORDION ============ */
  .completed-section {
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .completed-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .completed-toggle .chev { transition: transform .18s ease; font-size: 10px; }
  .completed-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .completed-toggle .badge-count {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 1px 7px;
    border-radius: 20px;
    margin-left: 6px;
  }
  .completed-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height .22s ease;
    padding: 0 14px;
  }
  .completed-list.open {
    max-height: 600px;
    padding-bottom: 14px;
  }
  .completed-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    background: var(--bg);
    margin-top: 8px;
    cursor: pointer;
  }
  .completed-item .tick {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--sig-green);
    color: #08301f;
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .completed-item .name {
    font-size: 12.5px;
    color: var(--text-secondary);
    text-decoration: line-through;
    text-decoration-color: var(--text-tertiary);
  }

  /* ============ FAB ============ */
  .fab {
    position: fixed;
    bottom: 28px;
    right: 32px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 26px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 10px 28px -6px color-mix(in srgb, var(--accent) 60%, transparent);
    z-index: 25;
    transition: transform .15s ease;
  }
  .fab:hover { transform: translateY(-2px) scale(1.03); }

  /* ============ MODAL ============ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 26px 26px 22px;
  }
  .modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 18px;
  }
  .modal-head h2 {
    font-family: var(--font-display);
    font-size: 18px;
    margin: 0 0 6px;
    line-height: 1.3;
  }
  .modal-head .task-owner-line {
    font-size: 12px;
    color: var(--text-tertiary);
    font-family: var(--font-mono);
  }
  .modal-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { border-color: var(--accent); color: var(--accent); }

  .field-block { margin-bottom: 16px; }
  .field-block label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    margin-bottom: 6px;
  }
  .field-block p.value {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-primary);
    line-height: 1.55;
  }
  .field-row {
    display: flex;
    gap: 14px;
  }
  .field-row .field-block { flex: 1; }

  input[type="text"], input[type="date"], textarea, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 9px 11px;
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: 13.5px;
    outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 6px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .btn {
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn:hover { filter: brightness(1.06); }

  @media (max-width: 720px) {
    header.topbar { padding: 14px 16px; }
    .board { padding: 18px 16px 100px; }
    .fab { right: 20px; bottom: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ============ DRAG STATE (added for real Sortable wiring) ============ */
  .sortable-ghost { opacity: 0.35; }
  .sortable-drag { cursor: grabbing; }
  .task-card[draggable], .task-card { cursor: grab; }

  .wip-flag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: var(--accent-soft);
    color: var(--accent);
    vertical-align: middle;
  }

  /* small field note used in the effort / WIP-override popups */
  .field-hint {
    font-size: 11px;
    color: var(--text-tertiary);
    margin: 4px 0 0;
  }

  /* toast for failed background syncs */
  .sync-toast {
    position: fixed;
    bottom: 28px;
    left: 32px;
    max-width: 320px;
    background: var(--surface-raised);
    border: 1px solid var(--sig-red);
    color: var(--text-primary);
    padding: 10px 14px;
    border-radius: var(--radius-md);
    font-size: 12.5px;
    box-shadow: var(--shadow);
    z-index: 60;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
  }
  .sync-toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 720px) {
    .sync-toast { left: 16px; right: 16px; max-width: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>Task<span class="dot">·</span>Matrix</h1>
    <span class="subtitle">Priority Board</span>
  </div>

  <div class="topbar-controls">
    <div class="assignee-filter">
      <button class="filter-trigger" id="filterTrigger" aria-haspopup="true" aria-expanded="false">
        <span class="stack" id="filterStack"></span>
        <span id="filterLabel">Select assignees</span>
        <span class="chevron">▾</span>
      </button>
      <div class="filter-panel" id="filterPanel">
        <div class="panel-label">Compare up to 3</div>
        <div id="filterOptions"></div>
        <div class="filter-hint">Showing side-by-side columns for selected people.</div>
      </div>
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark / light mode">🌙</button>
  </div>
</header>

<main class="board" id="board">
  <!-- columns injected by JS -->
</main>

<button class="fab" id="fabAdd" aria-label="Create task">+</button>

<!-- ===== TASK DETAIL MODAL ===== -->
<div class="modal-overlay" id="taskModalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
    <div class="modal-head">
      <div>
        <h2 id="taskModalTitle">Task name</h2>
        <div class="task-owner-line" id="taskModalOwnerLine">Owner · AR</div>
      </div>
      <button class="modal-close" data-close-modal="taskModalOverlay">✕</button>
    </div>

    <div class="field-block">
      <label>Description</label>
      <p class="value" id="taskModalDescription">—</p>
    </div>

    <div class="field-row">
      <div class="field-block">
        <label>Owner Deadline</label>
        <p class="value" id="taskModalDeadline">—</p>
      </div>
      <div class="field-block">
        <label>Assignee Est. Completion</label>
        <p class="value" id="taskModalEstCompletion">—</p>
      </div>
    </div>

    <div class="field-row">
      <div class="field-block">
        <label for="taskModalStatus">Status</label>
        <select id="taskModalStatus">
          <option value="Not Picked">Not Picked</option>
          <option value="Next Up">Next Up</option>
          <option value="WIP">WIP</option>
          <option value="Done">Done</option>
        </select>
      </div>
      <div class="field-block">
        <label for="taskModalEffort">Effort Estimation (days)</label>
        <input type="number" id="taskModalEffort" min="0.5" step="0.5" placeholder="e.g. 2">
      </div>
    </div>
    <p class="field-hint" id="taskModalEffortHint" style="display:none;">Required before moving out of "Not Picked".</p>

    <div class="modal-footer">
      <button class="btn" data-close-modal="taskModalOverlay">Cancel</button>
      <button class="btn primary" id="taskModalSave">Save changes</button>
    </div>
  </div>
</div>

<!-- ===== CREATE TASK MODAL ===== -->
<div class="modal-overlay" id="createModalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">
    <div class="modal-head">
      <div>
        <h2 id="createModalTitle">Create task</h2>
        <div class="task-owner-line">New entry</div>
      </div>
      <button class="modal-close" data-close-modal="createModalOverlay">✕</button>
    </div>

    <div class="field-block">
      <label for="newTaskName">Task Name</label>
      <input type="text" id="newTaskName" placeholder="e.g. Finalize Q3 pricing deck">
    </div>

    <div class="field-block">
      <label for="newTaskDescription">Description</label>
      <textarea id="newTaskDescription" placeholder="What needs to get done?"></textarea>
    </div>

    <div class="field-row">
      <div class="field-block">
        <label for="newTaskOwner">Owner Name</label>
        <input type="text" id="newTaskOwner" placeholder="e.g. Rhea Kapoor">
      </div>
      <div class="field-block">
        <label for="newTaskDeadline">Deadline</label>
        <input type="date" id="newTaskDeadline">
      </div>
    </div>

    <div class="field-block">
      <label for="newTaskAssignee">Assigned To</label>
      <select id="newTaskAssignee"></select>
    </div>

    <div class="modal-footer">
      <button class="btn" data-close-modal="createModalOverlay">Cancel</button>
      <button class="btn primary" id="createModalSave">Create task</button>
    </div>
  </div>
</div>

<script type="module">
/* =========================================================================
   PART A — BACKEND CLIENT  (was api-service.js)
   Thin wrapper around the Apps Script Web App. Deploy Code.gs first, then
   the /exec URL below must point at that deployment.
   ========================================================================= */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzN33vomd4IsSBYMTdo5QAnyu4KZHLu2k5_vlA-vF6uiABvKE7aX_18dL83fgzcnHzR/exec';

async function fetchTasks() {
  const res = await fetch(`${SCRIPT_URL}?action=list`);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function createTask(taskData) {
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight against Apps Script
    body: JSON.stringify({ action: 'create', data: taskData })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function updateTask(taskId, updatedFields) {
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'update', taskId, fields: updatedFields })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function deleteTaskRemote(taskId) {
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'delete', taskId })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

/** Working days (Mon-Fri) strictly between two dates. */
function getWorkingDaysBetween(startDate, endDate) {
  let count = 0;
  const cur = new Date(startDate);
  cur.setHours(0, 0, 0, 0);
  const end = new Date(endDate);
  end.setHours(0, 0, 0, 0);
  const step = end >= cur ? 1 : -1;
  while (cur.getTime() !== end.getTime()) {
    cur.setDate(cur.getDate() + step);
    const day = cur.getDay();
    if (day !== 0 && day !== 6) count += step;
  }
  return count;
}

/** Add N working days to a date. */
function addWorkingDays(startDate, numDays) {
  const cur = new Date(startDate);
  let added = 0;
  const n = Math.round(numDays);
  while (added < n) {
    cur.setDate(cur.getDate() + 1);
    const day = cur.getDay();
    if (day !== 0 && day !== 6) added++;
  }
  return cur;
}

/* =========================================================================
   PART B — STATIC ASSIGNEE ROSTER (UI-only metadata: role + initials).
   Assigned_To on a task record is the person's display name, matching
   ASSIGNEES[].name — that's the join key back to this roster.
   ========================================================================= */
const ASSIGNEES = [
  { id: "ar", name: "Aditi Rao",    role: "Business Analyst", initials: "AR" },
  { id: "vs", name: "Vikram Singh", role: "Product Ops",      initials: "VS" },
  { id: "pm", name: "Priya Menon",  role: "Data Engineer",    initials: "PM" },
  { id: "km", name: "Karan Mehta",  role: "Frontend Eng",     initials: "KM" },
];
const assigneeById   = (id)   => ASSIGNEES.find(a => a.id === id);
const assigneeByName = (name) => ASSIGNEES.find(a => a.name === name);

const STATUS_VALUES = ["Not Picked", "Next Up", "WIP", "Done"];

/* =========================================================================
   PART C — STATE  (single source of truth — Sortable only reflects this)
   Each task carries the Google Sheet's field names directly:
   Task_ID, Task_Name, Description, Owner_Name, Assigned_To, Deadline,
   Start_Date, Effort_Estimation_Days, Traffic_Light_Color, Status,
   Priority_Rank, WIP_Override_Reason, Estimated_completion_Date
   ========================================================================= */
let tasks = [];
let selectedAssignees = ["ar", "vs", "pm"]; // default up to 3 shown side-by-side

function setTasks(newTasks) {
  tasks = newTasks || [];
  renderBoard();
}

/* =========================================================================
   PART D — DERIVED / DISPLAY HELPERS
   Traffic_Light_Color is the urgency signal the server computes and stores
   (separate from workflow Status). We fall back to a local estimate for
   tasks that haven't round-tripped through the server yet (e.g. right
   after local creation, before the response lands).
   ========================================================================= */
function trafficLightClass(t) {
  const color = (t.Traffic_Light_Color || '').toLowerCase();
  if (color === 'green')  return 'status-on-track';
  if (color === 'yellow') return 'status-at-risk';
  if (color === 'red')    return 'status-overdue';
  if (color === 'grey' || color === 'gray') return 'status-not-picked';
  return `status-${estimateTrafficLight(t)}`;
}

function estimateTrafficLight(t) {
  if (!t.Deadline) return 'not-picked';
  const daysLeft = getWorkingDaysBetween(new Date(), new Date(t.Deadline));
  if (t.Status === 'Not Picked') return 'not-picked';
  if (daysLeft < 0) return 'overdue';
  if (daysLeft <= 1) return 'at-risk';
  return 'on-track';
}

function daysChipText(t) {
  if (!t.Deadline) return '—';
  const daysLeft = getWorkingDaysBetween(new Date(), new Date(t.Deadline));
  const start = t.Start_Date || t.Assigned_Date;
  const daysTotal = start ? getWorkingDaysBetween(new Date(start), new Date(t.Deadline)) : daysLeft;
  return `${daysLeft}/${daysTotal} Days`;
}

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt)) return String(d);
  return dt.toISOString().slice(0, 10);
}

function estCompletionText(t) {
  if (t.Estimated_completion_Date) return fmtDate(t.Estimated_completion_Date);
  if (t.Effort_Estimation_Days) {
    const base = t.Start_Date || t.Assigned_Date || new Date();
    return fmtDate(addWorkingDays(base, t.Effort_Estimation_Days));
  }
  return '—';
}

/* =========================================================================
   PART E — FILTER PANEL (unchanged behaviour, kept from the prototype)
   ========================================================================= */
function renderFilterOptions() {
  const wrap = document.getElementById("filterOptions");
  wrap.innerHTML = "";
  ASSIGNEES.forEach(a => {
    const checked = selectedAssignees.includes(a.id);
    const disabled = !checked && selectedAssignees.length >= 3;
    const opt = document.createElement("label");
    opt.className = "filter-option" + (disabled ? " disabled" : "");
    opt.innerHTML = `
      <input type="checkbox" data-id="${a.id}" ${checked ? "checked" : ""} ${disabled ? "disabled" : ""}>
      <span class="avatar-sm">${a.initials}</span>
      <span>${a.name}</span>
    `;
    wrap.appendChild(opt);
  });
  wrap.querySelectorAll("input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", (e) => {
      const id = e.target.dataset.id;
      if (e.target.checked) {
        if (selectedAssignees.length < 3) selectedAssignees.push(id);
      } else {
        selectedAssignees = selectedAssignees.filter(x => x !== id);
      }
      renderFilterOptions();
      renderFilterTrigger();
      renderBoard();
    });
  });
}

function renderFilterTrigger() {
  const stack = document.getElementById("filterStack");
  const label = document.getElementById("filterLabel");
  stack.innerHTML = "";
  selectedAssignees.forEach(id => {
    const a = assigneeById(id);
    const span = document.createElement("span");
    span.textContent = a.initials;
    stack.appendChild(span);
  });
  label.textContent = selectedAssignees.length
    ? `${selectedAssignees.length} of 3 selected`
    : "Select assignees";
}

document.getElementById("filterTrigger").addEventListener("click", (e) => {
  e.stopPropagation();
  const panel = document.getElementById("filterPanel");
  const trigger = document.getElementById("filterTrigger");
  const isOpen = panel.classList.toggle("open");
  trigger.setAttribute("aria-expanded", isOpen);
});
document.addEventListener("click", () => {
  document.getElementById("filterPanel").classList.remove("open");
  document.getElementById("filterTrigger").setAttribute("aria-expanded", "false");
});
document.getElementById("filterPanel").addEventListener("click", (e) => e.stopPropagation());

/* =========================================================================
   PART F — BOARD RENDER  (rebuilds every column's DOM from `tasks`)
   Re-rendering after every drag — even cancelled ones — is what lets us
   "revert" a Sortable-initiated DOM move without fighting the library.
   ========================================================================= */
function renderTaskCard(t) {
  const card = document.createElement("div");
  card.className = `task-card ${trafficLightClass(t)}`;
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  card.dataset.taskId = t.Task_ID;
  card.innerHTML = `
    <div class="task-top">
      <div class="initials-badge">${(assigneeByName(t.Owner_Name) || {}).initials || (t.Owner_Name || '?').slice(0,2).toUpperCase()}</div>
      <div class="days-chip">${daysChipText(t)}</div>
    </div>
    <p class="task-name">${t.Task_Name}${t.Status === 'WIP' ? '<span class="wip-flag">WIP</span>' : ''}</p>
    <div class="task-meta">${t.Status}</div>
  `;
  card.addEventListener("click", () => openTaskModal(t));
  card.addEventListener("keydown", (e) => { if (e.key === "Enter") openTaskModal(t); });
  return card;
}

function renderColumn(assigneeId) {
  const person = assigneeById(assigneeId);
  const activeTasks = tasks
    .filter(t => assigneeByName(t.Assigned_To)?.id === assigneeId && t.Status !== 'Done')
    .sort((a, b) => (a.Priority_Rank ?? 0) - (b.Priority_Rank ?? 0));
  const completed = tasks
    .filter(t => assigneeByName(t.Assigned_To)?.id === assigneeId && t.Status === 'Done');

  const col = document.createElement("section");
  col.className = "column";
  col.innerHTML = `
    <div class="column-head">
      <div class="avatar">${person.initials}</div>
      <div class="who">
        <div class="name">${person.name}</div>
        <div class="role">${person.role}</div>
      </div>
      <div class="count">${activeTasks.length} active</div>
    </div>
    <div class="column-body task-list" id="col-body-${assigneeId}" data-assignee="${assigneeId}"></div>
    <div class="completed-section">
      <button class="completed-toggle" aria-expanded="false" data-target="completed-${assigneeId}">
        <span>Completed Tasks <span class="badge-count">${completed.length}</span></span>
        <span class="chev">▶</span>
      </button>
      <div class="completed-list" id="completed-${assigneeId}"></div>
    </div>
  `;

  const body = col.querySelector(`#col-body-${assigneeId}`);
  if (activeTasks.length === 0) {
    body.innerHTML = `<div class="task-meta" style="padding:6px 4px;">No active tasks.</div>`;
  } else {
    activeTasks.forEach(t => body.appendChild(renderTaskCard(t)));
  }

  const completedList = col.querySelector(`#completed-${assigneeId}`);
  completed.forEach(t => {
    const item = document.createElement("div");
    item.className = "completed-item";
    item.innerHTML = `<span class="tick">✓</span><span class="name">${t.Task_Name}</span>`;
    item.addEventListener("click", () => openTaskModal(t));
    completedList.appendChild(item);
  });

  return col;
}

function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  if (selectedAssignees.length === 0) {
    board.innerHTML = `<div class="empty-state">Select up to 3 assignees above to view their boards side-by-side.</div>`;
    return;
  }
  selectedAssignees.forEach(id => board.appendChild(renderColumn(id)));
  initSortableForVisibleColumns();
}

/* accordion toggle (event delegation) */
document.getElementById("board").addEventListener("click", (e) => {
  const btn = e.target.closest(".completed-toggle");
  if (!btn) return;
  const target = document.getElementById(btn.dataset.target);
  const isOpen = target.classList.toggle("open");
  btn.setAttribute("aria-expanded", isOpen);
});

/* =========================================================================
   PART G — DRAG & DROP  (was app.js §3–6)
   Only columns currently on screen (the up-to-3 selected assignees) can be
   drag targets, so we (re)init Sortable after every renderBoard().
   ========================================================================= */
function initSortableForVisibleColumns() {
  document.querySelectorAll('.task-list').forEach((column) => {
    new Sortable(column, {
      group: 'kanban-assignees',
      animation: 150,
      onEnd: handleDragEnd,
    });
  });
}

function handleDragEnd(evt) {
  const taskId = evt.item.dataset.taskId;
  const task = tasks.find(t => String(t.Task_ID) === String(taskId));
  if (!task) return;

  const fromAssignee = evt.from.dataset.assignee;
  const toAssignee = evt.to.dataset.assignee;

  if (fromAssignee === toAssignee) {
    handleVerticalReorder(task, evt.oldIndex, evt.newIndex, fromAssignee);
  } else {
    handleHorizontalReassignment(task, toAssignee);
  }
}

function handleVerticalReorder(task, oldIndex, newIndex, assigneeId) {
  const isDeprioritizing = newIndex > oldIndex;

  if (task.Status === 'WIP' && isDeprioritizing) {
    // Intercept: re-render first to snap the DOM back to current state,
    // undoing Sortable's optimistic move, then ask for a reason.
    renderBoard();
    showWipOverrideModal(task, (reason) => {
      applyReorder(assigneeId, oldIndex, newIndex);
      renderBoard();

      updateTask(task.Task_ID, {
        WIP_Override_Reason: reason,
        Priority_Rank: task.Priority_Rank,
      }).catch((err) => showSyncToast(`Failed to sync WIP override for "${task.Task_Name}"`, err));
    });
    return; // on cancel, nothing further — DOM already reverted
  }

  applyReorder(assigneeId, oldIndex, newIndex);
  renderBoard();

  updateTask(task.Task_ID, { Priority_Rank: task.Priority_Rank }).catch((err) =>
    showSyncToast(`Failed to sync reorder for "${task.Task_Name}"`, err)
  );
}

function applyReorder(assigneeId, oldIndex, newIndex) {
  const columnTasks = tasks
    .filter(t => assigneeByName(t.Assigned_To)?.id === assigneeId && t.Status !== 'Done')
    .sort((a, b) => (a.Priority_Rank ?? 0) - (b.Priority_Rank ?? 0));

  const [moved] = columnTasks.splice(oldIndex, 1);
  columnTasks.splice(newIndex, 0, moved);

  columnTasks.forEach((t, i) => { t.Priority_Rank = i; });
}

function handleHorizontalReassignment(task, newAssigneeId) {
  const newAssignee = assigneeById(newAssigneeId);
  task.Assigned_To = newAssignee.name;

  const targetColumnTasks = tasks.filter(
    t => assigneeByName(t.Assigned_To)?.id === newAssigneeId && t.Task_ID !== task.Task_ID && t.Status !== 'Done'
  );
  const maxRank = targetColumnTasks.reduce((max, t) => Math.max(max, t.Priority_Rank ?? 0), -1);
  task.Priority_Rank = maxRank + 1;

  renderBoard();

  updateTask(task.Task_ID, {
    Assigned_To: task.Assigned_To,
    Priority_Rank: task.Priority_Rank,
  }).catch((err) => showSyncToast(`Failed to sync reassignment for "${task.Task_Name}"`, err));
}

/* =========================================================================
   PART H — TASK DETAIL MODAL  (status edits + the Not Picked -> active gate)
   ========================================================================= */
let activeModalTask = null;

function openTaskModal(t) {
  activeModalTask = t;
  document.getElementById("taskModalTitle").textContent = t.Task_Name;
  document.getElementById("taskModalOwnerLine").textContent = `Owner · ${t.Owner_Name || '—'}`;
  document.getElementById("taskModalDescription").textContent = t.Description || "No description provided.";
  document.getElementById("taskModalDeadline").textContent = fmtDate(t.Deadline);
  document.getElementById("taskModalEstCompletion").textContent = estCompletionText(t);
  document.getElementById("taskModalStatus").value = t.Status || "Not Picked";
  document.getElementById("taskModalEffort").value = t.Effort_Estimation_Days || "";
  document.getElementById("taskModalEffortHint").style.display = "none";
  openModal("taskModalOverlay");
}

document.getElementById("taskModalStatus").addEventListener("change", (e) => {
  const hint = document.getElementById("taskModalEffortHint");
  const activating = e.target.value !== 'Not Picked' && activeModalTask && activeModalTask.Status === 'Not Picked';
  hint.style.display = activating ? "block" : "none";
});

document.getElementById("taskModalSave").addEventListener("click", () => {
  if (!activeModalTask) return;
  const newStatus = document.getElementById("taskModalStatus").value;
  const effortRaw = document.getElementById("taskModalEffort").value;
  const effort = effortRaw ? parseFloat(effortRaw) : null;

  const isActivating = activeModalTask.Status === 'Not Picked' && ['Next Up', 'WIP'].includes(newStatus);
  if (isActivating && !(effort > 0)) {
    document.getElementById("taskModalEffortHint").style.display = "block";
    document.getElementById("taskModalEffort").focus();
    return; // block save until an estimate is supplied
  }

  const fields = { Status: newStatus };
  if (effort > 0) fields.Effort_Estimation_Days = effort;

  Object.assign(activeModalTask, fields);
  closeModal("taskModalOverlay");
  renderBoard();

  updateTask(activeModalTask.Task_ID, fields).catch((err) =>
    showSyncToast(`Failed to save "${activeModalTask.Task_Name}"`, err)
  );
});

/* =========================================================================
   PART I — CREATE TASK MODAL  (was app.js §8.1)
   ========================================================================= */
function populateAssigneeSelect() {
  const sel = document.getElementById("newTaskAssignee");
  sel.innerHTML = ASSIGNEES.map(a => `<option value="${a.id}">${a.name}</option>`).join("");
}

document.getElementById("fabAdd").addEventListener("click", () => {
  document.getElementById("newTaskName").value = "";
  document.getElementById("newTaskDescription").value = "";
  document.getElementById("newTaskOwner").value = "";
  document.getElementById("newTaskDeadline").value = "";
  openModal("createModalOverlay");
});

document.getElementById("createModalSave").addEventListener("click", async () => {
  const saveBtn = document.getElementById("createModalSave");
  const assigneeId = document.getElementById("newTaskAssignee").value;
  const newTaskData = {
    Task_Name: document.getElementById("newTaskName").value.trim(),
    Description: document.getElementById("newTaskDescription").value.trim(),
    Owner_Name: document.getElementById("newTaskOwner").value.trim(),
    Assigned_To: assigneeById(assigneeId).name,
    Deadline: document.getElementById("newTaskDeadline").value,
    Start_Date: fmtDate(new Date()),
    Status: 'Not Picked',
    Priority_Rank: tasks.filter(t => assigneeByName(t.Assigned_To)?.id === assigneeId && t.Status !== 'Done').length,
  };
  if (!newTaskData.Task_Name) return;

  saveBtn.disabled = true;
  try {
    const savedTask = await createTask(newTaskData);
    tasks.push(Object.assign({ Task_ID: savedTask.Task_ID ?? savedTask.id }, newTaskData, savedTask));
    renderBoard();
    closeModal("createModalOverlay");
  } catch (err) {
    showSyncToast('Failed to create task', err);
  } finally {
    saveBtn.disabled = false;
  }
});

/* =========================================================================
   PART J — MODALS: shared helpers + the two dynamically-built popups
   (WIP override confirmation, effort estimation) — was app.js §8
   ========================================================================= */
function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }
document.querySelectorAll("[data-close-modal]").forEach(btn => {
  btn.addEventListener("click", () => closeModal(btn.dataset.closeModal));
});
document.querySelectorAll(".modal-overlay").forEach(overlay => {
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(overlay.id); });
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    document.querySelectorAll(".modal-overlay.open").forEach(o => closeModal(o.id));
  }
});

function showWipOverrideModal(task, onConfirm) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay open';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2>⚠ WIP Task Deprioritization</h2>
          <div class="task-owner-line">${task.Task_Name}</div>
        </div>
      </div>
      <p class="field-hint" style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;">
        This task is currently being worked on. Deprioritizing it will halt progress.
      </p>
      <div class="field-block">
        <label for="override-reason">Reason for Override</label>
        <input type="text" id="override-reason" placeholder="Required">
      </div>
      <div class="modal-footer">
        <button class="btn" id="cancel-move">Cancel</button>
        <button class="btn primary" id="confirm-move" disabled>Confirm Move</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const reasonInput = overlay.querySelector('#override-reason');
  const confirmBtn = overlay.querySelector('#confirm-move');
  const cancelBtn = overlay.querySelector('#cancel-move');

  reasonInput.addEventListener('input', () => {
    confirmBtn.disabled = reasonInput.value.trim().length === 0;
  });
  confirmBtn.addEventListener('click', () => {
    const reason = reasonInput.value.trim();
    document.body.removeChild(overlay);
    onConfirm(reason);
  });
  cancelBtn.addEventListener('click', () => {
    document.body.removeChild(overlay); // no callback — move is abandoned, DOM already reverted
  });
}

function showSyncToast(message, err) {
  console.error(message, err);
  let toast = document.getElementById('syncToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'syncToast';
    toast.className = 'sync-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = `${message}. Your view is up to date locally; it'll retry syncing next change.`;
  toast.classList.add('show');
  clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 4500);
}

/* =========================================================================
   PART K — THEME TOGGLE  (unchanged)
   ========================================================================= */
const themeToggle = document.getElementById("themeToggle");
themeToggle.addEventListener("click", () => {
  const html = document.documentElement;
  const isDark = html.getAttribute("data-theme") === "dark";
  html.setAttribute("data-theme", isDark ? "light" : "dark");
  themeToggle.textContent = isDark ? "☀️" : "🌙";
});

/* =========================================================================
   PART L — BOOTSTRAP  (was app.js §9)
   ========================================================================= */
async function initializeApp() {
  renderFilterOptions();
  renderFilterTrigger();
  populateAssigneeSelect();
  renderBoard(); // initial (empty) paint + wires up Sortable

  try {
    const realTasks = await fetchTasks();
    setTasks(realTasks);
  } catch (error) {
    showSyncToast('Failed to load tasks from the sheet', error);
  }
}

initializeApp();
</script>

<!-- SortableJS powers the drag-and-drop reordering / reassignment -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
