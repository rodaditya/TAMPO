<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root {
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;

    --accent: #5B6EF5;
    --accent-soft: #5B6EF51a;

    /* urgency signal colors */
    --sig-grey: #8A8F98;
    --sig-grey-bg: #8a8f9814;
    --sig-green: #22C58B;
    --sig-green-bg: #22c58b14;
    --sig-yellow: #E5A93C;
    --sig-yellow-bg: #e5a93c1c;
    --sig-red: #EF5A5A;
    --sig-red-bg: #ef5a5a1c;
  }

  html[data-theme="dark"] {
    --bg: #0F1115;
    --bg-grid: #ffffff08;
    --surface: #171A21;
    --surface-raised: #1E222B;
    --border: #2A2E38;
    --text-primary: #EDEEF2;
    --text-secondary: #8B909C;
    --text-tertiary: #5C616D;
    --shadow: 0 8px 24px -8px rgba(0,0,0,0.55);
    --overlay: rgba(8, 9, 12, 0.72);
  }

  html[data-theme="light"] {
    --bg: #F3F4F7;
    --bg-grid: #00000006;
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --border: #E3E5EB;
    --text-primary: #171A21;
    --text-secondary: #676C78;
    --text-tertiary: #9499A3;
    --shadow: 0 8px 24px -10px rgba(23,26,33,0.18);
    --overlay: rgba(23, 26, 33, 0.45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 100% 42px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0 / 42px 100%,
      var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s ease, color .25s ease;
  }

  /* ============ HEADER ============ */
  header.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 18px 32px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .brand .dot { color: var(--accent); }
  .brand .subtitle {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .topbar-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Assignee filter */
  .assignee-filter {
    position: relative;
  }
  .filter-trigger {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 14px;
    border-radius: var(--radius-md);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .15s ease;
  }
  .filter-trigger:hover { border-color: var(--accent); }
  .filter-trigger .stack {
    display: flex;
  }
  .filter-trigger .stack span {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-family: var(--font-mono);
    font-size: 9px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--surface);
    margin-left: -7px;
  }
  .filter-trigger .stack span:first-child { margin-left: 0; }
  .filter-trigger .chevron { color: var(--text-tertiary); font-size: 10px; }

  .filter-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 240px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 2px;
    z-index: 30;
  }
  .filter-panel.open { display: flex; }
  .filter-panel .panel-label {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    padding: 4px 8px 8px;
  }
  .filter-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  .filter-option:hover { background: var(--bg); }
  .filter-option input { accent-color: var(--accent); width: 15px; height: 15px; }
  .filter-option .avatar-sm {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .filter-option.disabled { opacity: 0.35; pointer-events: none; }
  .filter-hint {
    font-size: 11px;
    color: var(--text-tertiary);
    padding: 6px 8px 2px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }

  /* Theme toggle */
  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 15px;
  }
  .theme-toggle:hover { border-color: var(--accent); }

  /* ============ BOARD ============ */
  .board {
    display: flex;
    gap: 18px;
    padding: 24px 32px 100px;
    align-items: flex-start;
    overflow-x: auto;
  }

  .empty-state {
    margin: 60px auto;
    text-align: center;
    color: var(--text-tertiary);
    font-family: var(--font-mono);
    font-size: 13px;
  }

  .column {
    flex: 1 1 340px;
    min-width: 300px;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .column-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 16px 14px;
    border-bottom: 1px solid var(--border);
  }
  .column-head .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .column-head .who { flex: 1; min-width: 0; }
  .column-head .who .name {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .column-head .who .role {
    font-size: 11px;
    color: var(--text-tertiary);
  }
  .column-head .count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 20px;
  }

  .column-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px;
  }

  /* ============ TASK CARD ============ */
  .task-card {
    position: relative;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    border-left: 4px solid var(--sig-grey);
    background: var(--sig-grey-bg);
    padding: 14px 14px 12px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .task-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .task-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .task-card.status-not-picked { border-left-color: var(--sig-grey); background: var(--sig-grey-bg); }
  .task-card.status-on-track  { border-left-color: var(--sig-green); background: var(--sig-green-bg); }
  .task-card.status-at-risk   { border-left-color: var(--sig-yellow); background: var(--sig-yellow-bg); }
  .task-card.status-overdue   { border-left-color: var(--sig-red); background: var(--sig-red-bg); }

  .task-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .initials-badge {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .days-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 5px;
    letter-spacing: 0.02em;
    color: #fff;
    white-space: nowrap;
  }
  .status-not-picked .days-chip { background: var(--sig-grey); }
  .status-on-track  .days-chip { background: var(--sig-green); color: #08301f; }
  .status-at-risk   .days-chip { background: var(--sig-yellow); color: #3a2600; }
  .status-overdue   .days-chip { background: var(--sig-red); }

  .task-name {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text-primary);
    margin: 0 0 6px;
  }
  .task-meta {
    font-size: 11px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
  }

  /* ============ COMPLETED ACCORDION ============ */
  .completed-section {
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .completed-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .completed-toggle .chev { transition: transform .18s ease; font-size: 10px; }
  .completed-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .completed-toggle .badge-count {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 1px 7px;
    border-radius: 20px;
    margin-left: 6px;
  }
  .completed-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height .22s ease;
    padding: 0 14px;
  }
  .completed-list.open {
    max-height: 600px;
    padding-bottom: 14px;
  }
  .completed-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    background: var(--bg);
    margin-top: 8px;
    cursor: pointer;
  }
  .completed-item .tick {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--sig-green);
    color: #08301f;
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .completed-item .name {
    font-size: 12.5px;
    color: var(--text-secondary);
    text-decoration: line-through;
    text-decoration-color: var(--text-tertiary);
  }

  /* ============ FAB ============ */
  .fab {
    position: fixed;
    bottom: 28px;
    right: 32px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 26px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 10px 28px -6px color-mix(in srgb, var(--accent) 60%, transparent);
    z-index: 25;
    transition: transform .15s ease;
  }
  .fab:hover { transform: translateY(-2px) scale(1.03); }

  /* ============ MODAL ============ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 26px 26px 22px;
  }
  .modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 18px;
  }
  .modal-head h2 {
    font-family: var(--font-display);
    font-size: 18px;
    margin: 0 0 6px;
    line-height: 1.3;
  }
  .modal-head .task-owner-line {
    font-size: 12px;
    color: var(--text-tertiary);
    font-family: var(--font-mono);
  }
  .modal-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { border-color: var(--accent); color: var(--accent); }

  .field-block { margin-bottom: 16px; }
  .field-block label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    margin-bottom: 6px;
  }
  .field-block p.value {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-primary);
    line-height: 1.55;
  }
  .field-row {
    display: flex;
    gap: 14px;
  }
  .field-row .field-block { flex: 1; }

  input[type="text"], input[type="date"], textarea, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 9px 11px;
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: 13.5px;
    outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 6px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .btn {
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn:hover { filter: brightness(1.06); }

  @media (max-width: 720px) {
    header.topbar { padding: 14px 16px; }
    .board { padding: 18px 16px 100px; }
    .fab { right: 20px; bottom: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>Task<span class="dot">·</span>Matrix</h1>
    <span class="subtitle">Priority Board</span>
  </div>

  <div class="topbar-controls">
    <div class="assignee-filter">
      <button class="filter-trigger" id="filterTrigger" aria-haspopup="true" aria-expanded="false">
        <span class="stack" id="filterStack"></span>
        <span id="filterLabel">Select assignees</span>
        <span class="chevron">▾</span>
      </button>
      <div class="filter-panel" id="filterPanel">
        <div class="panel-label">Compare up to 3</div>
        <div id="filterOptions"></div>
        <div class="filter-hint">Showing side-by-side columns for selected people.</div>
      </div>
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark / light mode">🌙</button>
  </div>
</header>

<main class="board" id="board">
  <!-- columns injected by JS -->
</main>

<button class="fab" id="fabAdd" aria-label="Create task">+</button>

<!-- ===== TASK DETAIL MODAL ===== -->
<div class="modal-overlay" id="taskModalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
    <div class="modal-head">
      <div>
        <h2 id="taskModalTitle">Task name</h2>
        <div class="task-owner-line" id="taskModalOwnerLine">Owner · AR</div>
      </div>
      <button class="modal-close" data-close-modal="taskModalOverlay">✕</button>
    </div>

    <div class="field-block">
      <label>Description</label>
      <p class="value" id="taskModalDescription">—</p>
    </div>

    <div class="field-row">
      <div class="field-block">
        <label>Owner Deadline</label>
        <p class="value" id="taskModalDeadline">—</p>
      </div>
      <div class="field-block">
        <label>Assignee Est. Completion</label>
        <p class="value" id="taskModalEstCompletion">—</p>
      </div>
    </div>

    <div class="field-block">
      <label for="taskModalStatus">Status</label>
      <select id="taskModalStatus">
        <option value="not-picked">Not Picked</option>
        <option value="on-track">On Track</option>
        <option value="at-risk">At Risk</option>
        <option value="overdue">Overdue</option>
        <option value="completed">Completed</option>
      </select>
    </div>

    <div class="modal-footer">
      <button class="btn" data-close-modal="taskModalOverlay">Cancel</button>
      <button class="btn primary" id="taskModalSave">Save changes</button>
    </div>
  </div>
</div>

<!-- ===== CREATE TASK MODAL ===== -->
<div class="modal-overlay" id="createModalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">
    <div class="modal-head">
      <div>
        <h2 id="createModalTitle">Create task</h2>
        <div class="task-owner-line">New entry</div>
      </div>
      <button class="modal-close" data-close-modal="createModalOverlay">✕</button>
    </div>

    <div class="field-block">
      <label for="newTaskName">Task Name</label>
      <input type="text" id="newTaskName" placeholder="e.g. Finalize Q3 pricing deck">
    </div>

    <div class="field-block">
      <label for="newTaskDescription">Description</label>
      <textarea id="newTaskDescription" placeholder="What needs to get done?"></textarea>
    </div>

    <div class="field-row">
      <div class="field-block">
        <label for="newTaskOwner">Owner Name</label>
        <input type="text" id="newTaskOwner" placeholder="e.g. Rhea Kapoor">
      </div>
      <div class="field-block">
        <label for="newTaskDeadline">Deadline</label>
        <input type="date" id="newTaskDeadline">
      </div>
    </div>

    <div class="field-block">
      <label for="newTaskAssignee">Assigned To</label>
      <select id="newTaskAssignee"></select>
    </div>

    <div class="modal-footer">
      <button class="btn" data-close-modal="createModalOverlay">Cancel</button>
      <button class="btn primary" id="createModalSave">Create task</button>
    </div>
  </div>
</div>

<script>
/* ============ DUMMY DATA ============ */
const ASSIGNEES = [
  { id: "ar", name: "Aditi Rao",    role: "Business Analyst", initials: "AR" },
  { id: "vs", name: "Vikram Singh", role: "Product Ops",      initials: "VS" },
  { id: "pm", name: "Priya Menon",  role: "Data Engineer",    initials: "PM" },
  { id: "km", name: "Karan Mehta",  role: "Frontend Eng",     initials: "KM" },
];

const TASKS = [
  { id: 1, name: "Audit 99Acres listing recommendation weights", description: "Review scoring weights in the recommendation engine for real-estate listings and flag anomalies in the top-K output.", owner: "Rhea Kapoor", ownerInitials: "RK", assignee: "ar", deadline: "2026-08-08", estCompletion: "2026-08-07", daysLeft: 1, daysTotal: 5, status: "at-risk" },
  { id: 2, name: "Build builder revenue email digest v2", description: "Extend the automated HTML email report to include week-over-week builder revenue deltas.", owner: "Aditi Rao", ownerInitials: "AR", assignee: "ar", deadline: "2026-08-12", estCompletion: "2026-08-11", daysLeft: 5, daysTotal: 7, status: "on-track" },

const STATUS_LABEL = {
  "not-picked": "Not Picked",
  "on-track": "On Track",
  "at-risk": "At Risk",
  "overdue": "Overdue",
  "completed": "Completed",
};

let selectedAssignees = ["ar", "vs", "pm"]; // default up to 3 shown side-by-side

/* ============ RENDER: FILTER PANEL ============ */
function renderFilterOptions() {
  const wrap = document.getElementById("filterOptions");
  wrap.innerHTML = "";
  ASSIGNEES.forEach(a => {
    const checked = selectedAssignees.includes(a.id);
    const disabled = !checked && selectedAssignees.length >= 3;
    const opt = document.createElement("label");
    opt.className = "filter-option" + (disabled ? " disabled" : "");
    opt.innerHTML = `
      <input type="checkbox" data-id="${a.id}" ${checked ? "checked" : ""} ${disabled ? "disabled" : ""}>
      <span class="avatar-sm">${a.initials}</span>
      <span>${a.name}</span>
    `;
    wrap.appendChild(opt);
  });
  wrap.querySelectorAll("input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", (e) => {
      const id = e.target.dataset.id;
      if (e.target.checked) {
        if (selectedAssignees.length < 3) selectedAssignees.push(id);
      } else {
        selectedAssignees = selectedAssignees.filter(x => x !== id);
      }
      renderFilterOptions();
      renderFilterTrigger();
      renderBoard();
    });
  });
}

function renderFilterTrigger() {
  const stack = document.getElementById("filterStack");
  const label = document.getElementById("filterLabel");
  stack.innerHTML = "";
  selectedAssignees.forEach(id => {
    const a = ASSIGNEES.find(x => x.id === id);
    const span = document.createElement("span");
    span.textContent = a.initials;
    stack.appendChild(span);
  });
  label.textContent = selectedAssignees.length
    ? `${selectedAssignees.length} of 3 selected`
    : "Select assignees";
}

document.getElementById("filterTrigger").addEventListener("click", (e) => {
  e.stopPropagation();
  const panel = document.getElementById("filterPanel");
  const trigger = document.getElementById("filterTrigger");
  const isOpen = panel.classList.toggle("open");
  trigger.setAttribute("aria-expanded", isOpen);
});
document.addEventListener("click", () => {
  document.getElementById("filterPanel").classList.remove("open");
  document.getElementById("filterTrigger").setAttribute("aria-expanded", "false");
});
document.getElementById("filterPanel").addEventListener("click", (e) => e.stopPropagation());

/* ============ RENDER: BOARD ============ */
function daysChipText(t) {
  const n = Math.max(t.daysLeft, t.status === "overdue" ? t.daysLeft : t.daysLeft);
  return `${t.daysLeft}/${t.daysTotal} Days`;
}

function renderTaskCard(t) {
  const card = document.createElement("div");
  card.className = `task-card status-${t.status}`;
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  card.dataset.taskId = t.id;
  card.dataset.source = "active";
  card.innerHTML = `
    <div class="task-top">
      <div class="initials-badge">${t.ownerInitials}</div>
      <div class="days-chip">${daysChipText(t)}</div>
    </div>
    <p class="task-name">${t.name}</p>
    <div class="task-meta">${STATUS_LABEL[t.status]}</div>
  `;
  card.addEventListener("click", () => openTaskModal(t));
  card.addEventListener("keydown", (e) => { if (e.key === "Enter") openTaskModal(t); });
  return card;
}

function renderColumn(assigneeId) {
  const person = ASSIGNEES.find(a => a.id === assigneeId);
  const activeTasks = TASKS.filter(t => t.assignee === assigneeId);
  const completed = COMPLETED_TASKS[assigneeId] || [];

  const col = document.createElement("section");
  col.className = "column";
  col.innerHTML = `
    <div class="column-head">
      <div class="avatar">${person.initials}</div>
      <div class="who">
        <div class="name">${person.name}</div>
        <div class="role">${person.role}</div>
      </div>
      <div class="count">${activeTasks.length} active</div>
    </div>
    <div class="column-body" id="col-body-${assigneeId}"></div>
    <div class="completed-section">
      <button class="completed-toggle" aria-expanded="false" data-target="completed-${assigneeId}">
        <span>Completed Tasks <span class="badge-count">${completed.length}</span></span>
        <span class="chev">▶</span>
      </button>
      <div class="completed-list" id="completed-${assigneeId}"></div>
    </div>
  `;

  const body = col.querySelector(`#col-body-${assigneeId}`);
  if (activeTasks.length === 0) {
    body.innerHTML = `<div class="task-meta" style="padding:6px 4px;">No active tasks.</div>`;
  } else {
    activeTasks.forEach(t => body.appendChild(renderTaskCard(t)));
  }

  const completedList = col.querySelector(`#completed-${assigneeId}`);
  completed.forEach(t => {
    const item = document.createElement("div");
    item.className = "completed-item";
    item.innerHTML = `<span class="tick">✓</span><span class="name">${t.name}</span>`;
    item.addEventListener("click", () => openTaskModal({ ...t, status: "completed" }));
    completedList.appendChild(item);
  });

  return col;
}

function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  if (selectedAssignees.length === 0) {
    board.innerHTML = `<div class="empty-state">Select up to 3 assignees above to view their boards side-by-side.</div>`;
    return;
  }
  selectedAssignees.forEach(id => board.appendChild(renderColumn(id)));
}

/* accordion toggle (event delegation) */
document.getElementById("board").addEventListener("click", (e) => {
  const btn = e.target.closest(".completed-toggle");
  if (!btn) return;
  const target = document.getElementById(btn.dataset.target);
  const isOpen = target.classList.toggle("open");
  btn.setAttribute("aria-expanded", isOpen);
});

/* ============ TASK DETAIL MODAL ============ */
function openTaskModal(t) {
  document.getElementById("taskModalTitle").textContent = t.name;
  document.getElementById("taskModalOwnerLine").textContent = `Owner · ${t.owner || t.ownerInitials}`;
  document.getElementById("taskModalDescription").textContent = t.description || "No description provided.";
  document.getElementById("taskModalDeadline").textContent = t.deadline || "—";
  document.getElementById("taskModalEstCompletion").textContent = t.estCompletion || "—";
  document.getElementById("taskModalStatus").value = t.status || "not-picked";
  openModal("taskModalOverlay");
}

document.getElementById("taskModalSave").addEventListener("click", () => {
  // Prototype only — no backend wiring yet.
  closeModal("taskModalOverlay");
});

/* ============ CREATE TASK MODAL ============ */
function populateAssigneeSelect() {
  const sel = document.getElementById("newTaskAssignee");
  sel.innerHTML = ASSIGNEES.map(a => `<option value="${a.id}">${a.name}</option>`).join("");
}

document.getElementById("fabAdd").addEventListener("click", () => {
  document.getElementById("newTaskName").value = "";
  document.getElementById("newTaskDescription").value = "";
  document.getElementById("newTaskOwner").value = "";
  document.getElementById("newTaskDeadline").value = "";
  openModal("createModalOverlay");
});

document.getElementById("createModalSave").addEventListener("click", () => {
  // Prototype only — no backend wiring yet.
  closeModal("createModalOverlay");
});

/* ============ MODAL HELPERS ============ */
function openModal(id) {
  document.getElementById(id).classList.add("open");
}
function closeModal(id) {
  document.getElementById(id).classList.remove("open");
}
document.querySelectorAll("[data-close-modal]").forEach(btn => {
  btn.addEventListener("click", () => closeModal(btn.dataset.closeModal));
});
document.querySelectorAll(".modal-overlay").forEach(overlay => {
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closeModal(overlay.id);
  });
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    document.querySelectorAll(".modal-overlay.open").forEach(o => closeModal(o.id));
  }
});

/* ============ THEME TOGGLE ============ */
const themeToggle = document.getElementById("themeToggle");
themeToggle.addEventListener("click", () => {
  const html = document.documentElement;
  const isDark = html.getAttribute("data-theme") === "dark";
  html.setAttribute("data-theme", isDark ? "light" : "dark");
  themeToggle.textContent = isDark ? "☀️" : "🌙";
});

/* ============ INIT ============ */
renderFilterOptions();
renderFilterTrigger();
renderBoard();
populateAssigneeSelect();
</script>
